function boardHTML(){const L=filtered();return '<div class="board">'+S.stages.map(s=>{const A=L.filter(c=>c.stage===s),v=A.reduce((a,c)=>a+(+c.value||0),0);

function reportHTML(){
  const W=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'],days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
  const v=days.map(d=>S.log[ymd(d)]||0),mx=Math.max(1,...v),tot=v.reduce((a,b)=>a+b,0),N=S.clients.length||1;
  const won=c=>c.stage==='Replied'||c.stage==='Potential'||c.stage==='Client';
  const grp=(t,key,names)=>{const rows=names.map(n=>{const A=S.clients.filter(c=>key(c)===n);return [n,A.length,A.filter(won).length]}).filter(r=>r[1]);
    return '<div class="sh"><h2>'+t+'</h2></div><div class="lst"><div class="rp h"><span>Name</span><span>Clients</span><span>Replied+</span><span>Rate</span></div>'+(rows.map(r=>'<div class="rp"><b>'+esc(r[0])+'</b><span>'+r[1]+'</span><span>'+r[2]+'</span><span>'+Math.round(r[2]/r[1]*100)+'%</span></div>').join('')||'<div class="empty">কোনো ডেটা নেই</div>')+'</div>'};
  return '<div class="sh"><h2>গত ৭ দিনে পাঠানো মেসেজ ('+tot+')</h2></div><div class="bars">'+v.map((n,i)=>'<div><span>'+n+'</span><i style="height:'+Math.round(n/mx*100)+'%"></i><span>'+W[days[i].getDay()]+'</span></div>').join('')+'</div>'
  +'<div class="sh"><h2>Pipeline</h2></div>'+S.stages.map(s=>{const n=S.clients.filter(c=>c.stage===s).length;return '<div class="fn"><span>'+esc(s)+'</span><i style="width:'+Math.round(n/N*100)+'%"></i><b>'+n+'</b></div>'}).join('')
  +grp('Source অনুযায়ী',c=>c.source||'',S.sources)+grp('Category অনুযায়ী',c=>c.cat,S.cats)+grp('Template অনুযায়ী (শেষ পাঠানো)',c=>c.tpl||'',S.tpls.map(t=>t.n))}
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#fbar').hidden=view==='today'||view==='report';if(S.brand){$('.brand').textContent=S.brand;document.title=S.brand}$('#chips').hidden=view!=='list';
  $('#chips').innerHTML='<button class="chip '+(!f.st?'on':'')+'" data-st="">All '+S.clients.length+'</button>'+S.stages.map(s=>'<button class="chip '+(f.st===s?'on':'')+'" data-st="'+esc(s)+'">'+esc(s)+' '+S.clients.filter(c=>c.stage===s).length+'</button>').join('');

/* add / edit */
function openEdit(id){

  +'<div><label>Page / profile link</label><input id="e_l" value="'+esc(c.link)+'"></div>'
  +'<div class="g g2"><div><label>Category (নতুন লিখলে যোগ হবে)</label><input id="e_c" list="cl" value="'+esc(c.cat)+'">'+dl('cl',S.cats)+'</div><div><label>Source</label><input id="e_o" list="sl" value="'+esc(c.source)+'">'+dl('sl',S.sources)+'</div></div>'
  +'<div class="g g2"><div><label>Stage</label><select id="e_s">'+opts(S.stages,c.stage)+'</select></div><div><label>WhatsApp দিয়ে contact</label><select id="e_a"><option value="">Ask each time</option><option'+(c.acc==='Business'?' selected':'')+'>Business</option><option'+(c.acc==='Personal'?' selected':'')+'>Personal</option></select></div></div>'
  +'<div class="g g2"><div><label>Deal value (৳)</label><input id="e_v" type="number" inputmode="numeric" value="'+esc(c.value)+'"></div><div><label>Follow-up date</label><input id="e_f" type="date" value="'+esc(c.fu)+'"></div></div>'
  +'<div><label>Note</label><textarea id="e_t">'+esc(c.note)+'</textarea></div>'
  +(c.h&&c.h.length?'<div class="hs"><b>History</b>'+c.h.slice(0,10).map(x=>'<div>'+esc(x.d)+': '+esc(x.t)+'</div>').join('')+'</div>':'')+'</div>'
  +'<div class="foot">'+(id?'<button class="dg" id="del">Delete</button>':'')+'<button id="x">Cancel</button><button class="pri" id="sv">Save</button></div>');
  $('#x').onclick=close;
  if(id)$('#del').onclick=()=>{const i=S.clients.findIndex(k=>k.id===id),old=S.clients[i];S.clients.splice(i,1);sel.delete(id);save();close();render();toast('Deleted: '+old.name,()=>{S.clients.splice(i,0,old);save();render()})};
  $('#sv').onclick=()=>{
    const n=$('#e_n').value.trim();if(!n){$('#e_n').focus();return}
    const ph=$('#e_p').value.trim();
    if(ph&&!okNum(ph)&&!confirm('নম্বরটি সঠিক মনে হচ্ছে না। তবুও সেভ করবেন?'))return;if(!id&&ph){const d=S.clients.find(k=>norm(k.phone)===norm(ph));if(d&&!confirm('এই নম্বর আগে থেকেই আছে ('+d.name+'). তবুও যোগ করবেন?'))return}
    const cat=$('#e_c').value.trim()||'General',src=$('#e_o').value.trim();
    if(!S.cats.includes(cat))S.cats.push(cat);if(src&&!S.sources.includes(src))S.sources.push(src);
    const old=c.stage;

    if(!id){c.id=uid();hist(c,'Added');S.clients.unshift(c)}else if(old!==c.stage)hist(c,'Stage: '+c.stage);
    save();close();render();
  };
}

/* send */
function openSend(ids){
  sendIds=ids;
  const hint=AND||IOS?'বেছে নেওয়া Business বা Personal WhatsApp app সরাসরি খুলবে (app install থাকতে হবে)।':'কম্পিউটারে যে WhatsApp (Web/Desktop) login করা আছে সেটাই খুলবে, Business/Personal আলাদা বাছা যায় না। নম্বর Copy করে ইচ্ছামতো account-এ paste করতে পারেন।';
  dlg('<h2>Send WhatsApp offer</h2><div class="g"><div><label>Template</label><div class="row"><select id="tp" style="flex:1;width:auto">'+S.tpls.map((t,i)=>'<option value="'+i+'">'+esc(t.n)+'</option>').join('')+'</select><button id="tpS">Save as new</button><button id="tpD" class="dg">Delete</button></div></div>'
  +'<div><label>Message ({name} জায়গায় ক্লায়েন্টের নাম বসবে)</label><textarea id="msg" style="min-height:110px"></textarea></div><div class="mut">'+hint+'</div><div id="rc"></div></div><div class="foot"><button id="x">Close</button></div>');
  const tp=$('#tp'),msg=$('#msg'),fill=()=>{msg.value=S.tpls[tp.value]?S.tpls[tp.value].t:''};fill();tp.onchange=fill;if(ids.length===1){const c0=S.clients.find(x=>x.id===ids[0]),sq=c0&&c0.step>0&&S.seq[c0.step-1];if(sq){const i=S.tpls.findIndex(t=>t.n===sq.t);if(i>=0){tp.value=i;fill()}}}
  $('#tpS').onclick=()=>{const n=prompt('Template name?');if(!n||!msg.value.trim())return;S.tpls.push({n,t:msg.value});save();openSend(sendIds)};
  $('#tpD').onclick=()=>{if(S.tpls[tp.value]&&confirm('Delete this template?')){S.tpls.splice(tp.value,1);save();openSend(sendIds)}};
  $('#rc').innerHTML=ids.map(id=>{const c=S.clients.find(x=>x.id===id);if(!c)return '';const ok=norm(c.phone).length>=11,b=a=>'<button class="go'+(c.acc===a?' wa':'')+'" data-a="'+a+'"'+(ok?'':' disabled')+'>'+a+'</button>';
    return '<div class="rc" data-id="'+id+'"><div><div class="nm">'+esc(c.name)+'</div><div class="mut">'+esc(c.phone||'No number')+'</div></div><div class="row">'+b('Business')+b('Personal')+'<button class="cp">Copy</button></div></div>'}).join('');
  $('#rc').onclick=e=>{const r=e.target.closest('.rc');if(!r)return;const c=S.clients.find(x=>x.id===r.dataset.id);
    if(e.target.closest('.cp')){copy(local(c.phone),e.target.closest('.cp'));return}
    const b=e.target.closest('.go');if(!b)return;const acc=b.dataset.a;
    window.open(waUrl(norm(c.phone),msg.value.replace(/\{name\}/g,c.name),acc),'_blank');
    if(!c.acc)c.acc=acc;c.last=today();if(c.stage===S.stages[0])c.stage=S.stages[1]||c.stage;
    c.step=(c.step||0)+1;c.tpl=(S.tpls[tp.value]||{}).n||'';const sq=S.seq.length?S.seq[c.step-1]:{d:S.fu};c.fu=sq&&!closed(c)?addDays(sq.d):'';hist(c,'Message '+c.step+' sent via '+acc);S.log[today()]=(S.log[today()]||0)+1;
    save();render();r.classList.add('done');b.textContent=acc+' ✓'};
  $('#x').onclick=close;
}

/* import / export / settings */
function openImport(){
  dlg('<h2>Import from Google Sheet</h2><p class="mut">Sheet-এর সারি copy করে paste করুন। কলামের ক্রম: Name, Page Link, WhatsApp, Reach out (“Done” থাকলে Contacted ধরা হবে)। একই নম্বর দুইবার যোগ হবে না।</p>'
  +'<div class="g"><div><label class="btn up" for="if">'+ic('up')+'<span>Upload file (.csv, .xlsx, .tsv, .txt, backup .json)</span></label><input id="if" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls,.json" hidden><div class="mut" id="ifn" style="margin-top:6px">Google Sheet থেকে File > Download > CSV বা Excel করে এখানে দিন, অথবা নিচে paste করুন।</div></div><textarea id="ip" style="min-height:150px" placeholder="JY LIGHT&#9;https://facebook.com/...&#9;01823-030024&#9;Done"></textarea><div class="g g2"><div><label>Category</label><input id="ic" list="cl" value="'+esc(S.cats[0])+'">'+dl('cl',S.cats)+'</div><div><label>Contact via</label><select id="ia"><option value="">Ask each time</option><option>Business</option><option>Personal</option></select></div></div></div>'
  +'<div class="foot"><button id="x">Cancel</button><button class="pri" id="go">Import</button></div>');
  $('#x').onclick=close;
  function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
  $('#if').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let t;
    if(/\.xlsx?$/i.test(f.name)){await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});t=XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]])}else t=(await f.text()).replace(/^\uFEFF/,'');
    if(t.trim()[0]==='{'){$('#ip').value=t;$('#ifn').textContent=f.name;return}
    const R=parseCSV(t);$('#ip').value=R.map(r=>r.map(x=>String(x).replace(/[\t\r\n]+/g,' ').trim()).join('\t')).join('\n');
    $('#ifn').textContent=f.name+': '+R.length+' সারি পাওয়া গেছে। নিচে দেখে Import চাপুন।'}catch(x){$('#ifn').textContent='File পড়া যায়নি, CSV হিসেবে download করে আবার চেষ্টা করুন।'}e.target.value=''};
  $('#go').onclick=()=>{
    const raw=$('#ip').value.trim();if(raw[0]==='{'){try{const o=JSON.parse(raw),ids=new Set(S.clients.map(c=>c.id));let k=0;(o.clients||[]).forEach(c=>{if(c&&c.id&&c.name&&!ids.has(c.id)){S.clients.push(c);k++}});save();close();render();toast(k+' client restore হয়েছে')}catch(e){toast('Backup পড়া যায়নি')}return}
    const cat=$('#ic').value.trim()||'General',acc=$('#ia').value;if(!S.cats.includes(cat))S.cats.push(cat);
    const have=new Set(S.clients.map(c=>norm(c.phone)));let n=0,dup=0,bad=0,nn=0;
    $('#ip').value.split(/\r?\n/).forEach(l=>{if(!l.trim())return;const p=l.split('\t').map(x=>x.trim());if(/^name$/i.test(p[0]))return;
      const ph=norm(p[2]);if(!p[0]){nn++;return}if(ph&&have.has(ph)){dup++;return}have.add(ph);if(ph&&!okNum(p[2]))bad++;const done=/done/i.test(p[3]||'');
      S.clients.push({id:uid(),name:p[0],link:p[1]||'',phone:p[2]||'',cat,acc,source:'',value:'',fu:'',stage:done?(S.stages[1]||S.stages[0]):S.stages[0],note:'',last:done?'Done':'',h:[]});n++});
    save();close();render();toast(n+' imported, '+dup+' duplicate বাদ, '+nn+' নামহীন বাদ, '+bad+' নম্বর সন্দেহজনক ⚠');
  };
}

  $('#x').onclick=close;
  $('#sv').onclick=()=>{const ls=id=>[...new Set($(id).value.split('\n').map(s=>s.trim()).filter(Boolean))];

    if(tool==='send_message'&&!confirm('Backup '+files.length+'টি file '+em+' ঠিকানায় email করা হবে। এগিয়ে যাবেন?'))return;
    const mcp=await claude.use('mcp');if(!mcp){st.textContent='এই view-তে Gmail সংযোগ চালু নেই। claude.ai-তে artifactটি খোলা দরকার।';return}
    st.textContent='পাঠানো হচ্ছে…';
    try{
      await mcp.callTool('Gmail',tool,{to:[em],subject:'Client Hunter backup '+stamp,body:'Client Hunter backup ('+stamp+'), '+files.length+'টি file সংযুক্ত।',attachments:files.map(f=>({filename:f.n,mimeType:/\.csv$/.test(f.n)?'text/csv':'application/json',content:b64(f.d)}))});
      st.textContent=tool==='send_message'?'✓ Email পাঠানো হয়েছে, Gmail-এর Inbox/Sent দেখুন':'✓ Draft তৈরি হয়েছে, Gmail → Drafts দেখুন'
    }catch(e){const c=e&&e.code;st.textContent=c==='server_not_connected'||c==='selection_required'?'Gmail connector যুক্ত নেই। claude.ai → Settings → Connectors-এ Gmail যুক্ত করুন':c==='needs_reauth'?'Gmail আবার connect করুন (Settings → Connectors)':(c==='not_in_manifest'||c==='approval_required'||c==='blocked_by_policy')?'Gmail ব্যবহারের অনুমতি পাওয়া যায়নি':c==='tool_error'?'Gmail পাঠাতে পারেনি: '+String(e.message||'').slice(0,120):'সংযোগ সমস্যা। পাঠানো হয়েছে কি না Gmail Sent-এ দেখে নিন, না হলে আবার চেষ্টা করুন'}
  };
  $('#gsend').onclick=()=>gm('send_message');$('#gdraft').onclick=()=>gm('create_draft');
  $('#bf').onchange=async e=>{const r=[];for(const f of e.target.files){try{r.push(f.name+': '+restoreOne(f.name,await f.text()))}catch(x){r.push(f.name+': পড়া যায়নি')}}save();render();$('#br').innerHTML=r.map(esc).join('<br>');e.target.value=''};
  $('#x').onclick=close;
}

function plat(u){u=fixLink(u);if(!u)return null;let h='';try{const x=new URL(u);h=x.hostname.replace(/^www\./,'').toLowerCase()+x.pathname}catch(e){return null}
  const P=[['yt',/(^|\.)(youtube\.com|youtu\.be)/,'#ff0000','YouTube'],['fb',/(^|\.)(facebook\.com|fb\.com|fb\.me|fb\.watch)/,'#1877f2','Facebook'],['ig',/(^|\.)instagram\.com/,'#e1306c','Instagram'],['tt',/(^|\.)tiktok\.com/,'var(--ink)','TikTok'],['li',/(^|\.)linkedin\.com/,'#0a66c2','LinkedIn'],['tw',/(^|\.)(twitter|x)\.com/,'var(--ink)','X / Twitter'],['tg',/(^|\.)(t\.me|telegram\.org)/,'#229ed9','Telegram'],['wa',/(^|\.)(wa\.me|whatsapp\.com)/,'#25a244','WhatsApp'],['mp',/(maps\.app\.goo\.gl|goo\.gl\/maps|google\.[a-z.]+\/maps)/,'#34a853','Google Maps']];
  for(const p of P)if(p[1].test(h))return {i:p[0],c:p[2],n:p[3],u};
  return {i:'gl',c:'var(--ac)',n:h.split('/')[0]||'Website',u}}

  ['#e_st','#e_a'].forEach(s=>{$(s).onclick=e=>{const b=e.target.closest('.opt');if(b)[...$(s).children].forEach(x=>x.classList.toggle('on',x===b))}});

  $('#sv').onclick=()=>{
    const n=$('#e_n').value.trim();if(!n){$('#e_n').focus();return}
    const ph=$('#e_p').value.trim();
    if(ph&&!okNum(ph)&&!confirm('নম্বরটি সঠিক মনে হচ্ছে না। তবুও সেভ করবেন?'))return;
    if(!id&&ph){const d=S.clients.find(k=>norm(k.phone)===norm(ph));if(d&&!confirm('এই নম্বর আগে থেকেই আছে ('+d.name+'). তবুও যোগ করবেন?'))return}
    const cat=$('#e_c').value.trim()||'General',src=$('#e_o').value.trim(),st=$('#e_st .opt.on'),ac=$('#e_a .opt.on'),old=c.stage;
    if(!S.cats.includes(cat))S.cats.push(cat);if(src&&!S.sources.includes(src))S.sources.push(src);

    if(!id){c.id=uid();hist(c,'Added');S.clients.unshift(c)}else if(old!==c.stage)hist(c,'Stage: '+c.stage);
    save();close();render();
  };
}
