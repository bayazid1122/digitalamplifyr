<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Amplifyr Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="invcss"></style>
<style>
:root{--bg:#eef2f8;--ink:#0d1b3a;--muted:#5f6b85;--card:#fff;--line:#dde3ef;--soft:#f5f8fd;--navy:#0a1736;--green:#14c36f;--greenT:#0b8a50;--purple:#6d4aff;--blue:#1f6bff;--red:#d92d3a;--link:#1f55d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--ink:#e9eefc;--muted:#9aa8c8;--card:#111c3a;--line:#25325a;--soft:#0e1833;--greenT:#3ee08f;--red:#ff7b84;--link:#8fb0ff}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali','Segoe UI',sans-serif;line-height:1.45}
header{background:linear-gradient(120deg,#07122b,#12308a 70%,#0f6b5a);color:#fff;padding:16px 18px 58px}
.hw,.main{max-width:1180px;margin:0 auto}
.hw{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hw img{width:50px;height:50px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.hw h1{margin:0;font-size:1.4rem;line-height:1.1}
.hw small{opacity:.8}
.sp{flex:1}
.mode,.who{font-size:.8rem;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:99px}
.lg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:99px;padding:3px}
.lg button{background:transparent;color:#fff;padding:4px 12px;border-radius:99px;font-size:.85rem}
.lg button.on{background:#fff;color:#0a1736}
.lo{background:rgba(255,255,255,.14)!important;color:#fff!important;padding:5px 14px;font-size:.85rem}
.chips{margin-top:14px}
.chip{background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:5px 15px;font-size:.92rem}
.chip.on{background:#fff;color:#0a1736}
.main{padding:0 14px 90px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:-40px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 15px;border-top:4px solid var(--c);box-shadow:0 6px 18px rgba(10,23,54,.06)}
.stat small{color:var(--muted);display:block}
.stat b{font-size:1.5rem}
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:14px}
.cardx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 15px}
.cardx h3{margin:0 0 8px;font-size:1rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cardx h3 span{flex:1}
.lgd{font-size:.78rem;color:var(--muted);font-weight:400}.lgd i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.tc{text-align:center}
.tbx{height:90px;display:flex;gap:4px;align-items:flex-end;justify-content:center}
.tbx i{display:block;width:34%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px}
.tbx .a{background:var(--blue)}.tbx .p{background:var(--green)}
.tc small{color:var(--muted)}
.hbr{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.88rem}
.hbr .l{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbr .t{flex:1;background:var(--soft);border-radius:6px;height:12px;overflow:hidden}
.hbr .t i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:6px}
.hbr b{min-width:70px;text-align:right}
.al{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
.al:first-of-type{border-top:0}
.al div{flex:1}
.al .mu{display:block}
.warn{color:var(--red);font-weight:700}
.bkr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--blue) 12%,var(--card));border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.bkr span{flex:1}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%;min-width:0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--navy);color:#fff;cursor:pointer}
button.g{background:var(--green);color:#04210f}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.rd{background:var(--red);color:#fff}
button.sm{padding:5px 11px;font-size:.85rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
.flt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px 14px;margin-bottom:14px}
.flt summary{cursor:pointer;font-weight:700;padding:8px 0;display:flex;gap:10px;align-items:center;list-style:none}
.flt summary::-webkit-details-marker{display:none}
.flt summary::before{content:"▾";color:var(--muted)}
.flt:not([open]) summary::before{content:"▸"}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fgrid label,.fgrid .rg{display:flex;flex-direction:column;gap:3px;font-size:.85rem;font-weight:500;color:var(--muted)}
.fgrid .rgw{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .cl{display:flex;align-items:flex-end}
.dp{display:grid;grid-template-columns:.85fr 1.1fr 1fr;gap:5px}
.dp select,.dp input{padding:9px 6px;font-size:.92rem;width:100%}
.hid{display:none!important}
body.staff .adm{display:none!important}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:960px}
th{background:var(--navy);color:#fff;padding:11px 10px;text-align:left;font-weight:600;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:top}
tr.m td{background:var(--soft);font-weight:700}
tr.m td span.s{font-weight:400;color:var(--muted);margin-left:10px;font-size:.9rem}
a{color:var(--link)}
.lk{background:none;color:var(--link);padding:0;font-size:1rem;text-align:left;font-weight:700}
.mu{color:var(--muted);font-size:.85rem;display:block}
.tag{display:inline-block;background:color-mix(in srgb,var(--purple) 16%,transparent);color:var(--purple);border-radius:99px;padding:0 9px;font-size:.75rem;font-weight:700}
.tag.b{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--greenT)}
.wb{background:none;color:var(--greenT);padding:0;font-size:.88rem;font-weight:600;text-decoration:underline}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:700}
.b.p{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--greenT)}
.b.d{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.b.h{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--link)}
.ac{white-space:normal}
.ac button{margin:0 2px 4px 0}
.empty{padding:44px 16px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(680px,94vw);max-height:92vh;padding:18px}
dialog::backdrop{background:rgba(5,10,25,.6)}
dialog h2{margin:0 0 12px;font-size:1.2rem}
.sec{margin:16px 0 8px;font-size:1rem}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:.9rem;font-weight:500}
.fg .f{grid-column:1/-1}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;align-items:center}
.it{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--soft)}
.ith{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sumx{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.sumx small{display:block;color:var(--muted)}
.sumx b{font-size:1.05rem}
.waopt{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.waopt a{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;border-radius:14px;padding:14px 16px;font-weight:700;font-size:1.05rem}
.waopt a small{display:block;font-weight:400;opacity:.9}
.waopt .w1{background:#25a244}.waopt .w2{background:#0b7a6b}
.hint{background:rgba(255,255,255,.25);border-radius:99px;padding:1px 10px;font-size:.75rem;margin-left:auto}
#invd{width:min(880px,96vw);background:var(--bg);padding:14px}
#invd .lg,#invd .seg{background:var(--card);border:1px solid var(--line)}
#invd .lg button,#invd .seg button{color:var(--ink)}#invd .lg button.on,#invd .seg button.on{background:var(--navy);color:#fff}
.seg{display:inline-flex;border-radius:99px;padding:3px}.seg button{background:transparent;padding:4px 12px;border-radius:99px;font-size:.85rem}
.pw{overflow:hidden;border-radius:10px}
#inv-in{transform-origin:top left;width:794px}
#inv-in .inv{margin-bottom:16px}
.gate{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:18px;overflow:auto;background:radial-gradient(900px 500px at 15% 10%,#1f4bd8 0,transparent 60%),radial-gradient(800px 500px at 90% 90%,#0f8a63 0,transparent 55%),#07122b}
body.locked .gate{display:flex}
body.locked header,body.locked .main,body.locked .fab{display:none}
.gc{width:min(400px,100%);background:var(--card);border-radius:22px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px}
.gc img{width:76px;height:76px;border-radius:50%;align-self:center;box-shadow:0 0 0 4px var(--line)}
.gc h2{margin:0;text-align:center;font-size:1.4rem}
.gc p{margin:0;text-align:center}
.gc label{display:flex;flex-direction:column;gap:3px;font-size:.9rem;font-weight:500}
.gc button.g{padding:12px;font-size:1.05rem}
.ge{color:var(--red);min-height:1.2em;font-size:.9rem;text-align:center}
.gc .lg{align-self:center;background:var(--soft);border:1px solid var(--line)}
.gc .lg button{color:var(--ink)}.gc .lg button.on{background:var(--navy);color:#fff}
.ul{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ul span{background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 12px;display:inline-flex;gap:6px;align-items:center}
.ul button{padding:0 8px;border-radius:99px;background:transparent;color:var(--red);font-size:1.1rem}
.sigp{max-height:70px;max-width:220px;display:block;margin:6px 0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;z-index:99;display:none;max-width:92vw;text-align:center}
.cb{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.cbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 11px 3px 7px;font-size:.84rem;font-weight:600;text-decoration:none;cursor:pointer}
.cbtn svg{margin:0!important}
.cbtn.wab{border-color:#25D366}.cbtn.fbb{border-color:#1877F2;color:var(--link)}
.rcode{font-size:1.5rem;font-weight:700;letter-spacing:2px;text-align:center;background:var(--soft);border:2px dashed var(--line);border-radius:14px;padding:16px;margin:12px 0;word-break:break-all}
.wtl{display:flex;flex-direction:column;gap:3px;font-size:.9rem;font-weight:500;margin-top:8px}
.wtl textarea{width:100%}
.hlp{font-size:.8rem;color:var(--muted)}
.fab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:2rem;line-height:1;padding:0;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:20}
#pa{display:none}
@media print{@page{size:A4;margin:0}body>*:not(#pa){display:none!important}#pa{display:block!important}body{background:#fff}#pa .inv{page-break-after:always}}
@media(max-width:760px){
 header{padding-bottom:52px}
 .fab{display:block}
 .lg button{padding:4px 9px}
 .tw{border:0;background:none;overflow:visible}
 table,tbody{display:block;min-width:0}
 thead{display:none}
 tr.o{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}
 tr.o td{display:block;border:0;padding:0}
 tr.o td[data-l]::before{content:attr(data-l);display:block;font-size:.74rem;color:var(--muted)}
 tr.o td.w{grid-column:1/-1}
 tr.m{display:block;margin:14px 0 8px}
 tr.m td{display:block;border:0;background:none;padding:0}
 .fg{grid-template-columns:1fr}
 .fgrid .rgw{grid-column:1/-1}
 #invd{padding:10px}
 #invd .row button{flex:1 1 40%}
}
</style>
</head>
<body class="locked">
<header>
  <div class="hw">
    <img data-logo alt="Digital Amplifyr logo">
    <div><h1 id="hn">Digital Amplifyr</h1><small data-i="sub"></small></div>
    <span class="sp"></span><span class="who" id="who"></span><span class="mode" id="mode"></span>
    <div class="lg" role="group" aria-label="Language"><button data-lg="en">EN</button><button data-lg="bn">বাংলা</button></div>
    <button class="lo" id="lo" data-i="logout"></button>
  </div>
</header>
<div class="main">
  <div class="stats" id="stats"></div>
  <div class="bkr adm hid" id="bkr"><span id="bkt"></span><button class="sm g" id="bkn" data-i="bkNow"></button></div>
  <div class="wg" id="wg">
    <div class="cardx" id="usc"><h3><span data-i="dolSum"></span><select id="ug"><option value="d" data-i="gDay"></option><option value="m" data-i="gMonth" selected></option><option value="y" data-i="gYear"></option><option value="c" data-i="gCustom"></option></select></h3><div id="ucw" class="hid" style="display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px"><div><span class="mu" data-i="from"></span><div class="dp" id="u_from" role="group"></div></div><div><span class="mu" data-i="to"></span><div class="dp" id="u_to" role="group"></div></div></div><div id="usb"></div></div>
    <div class="cardx hid" id="alc"><h3 data-i="boostAlert"></h3><div id="alr"></div></div>
  </div>
  <div class="tools">
    <button class="g" id="add" data-i="add"></button>
    <button class="alt adm" id="exp" data-i="exp"></button>
    <button class="alt adm" id="cp" data-i="cp"></button>
    <button class="alt adm" id="rep" data-i="report"></button>
    <button class="alt adm" id="bk" data-i="backup"></button>
    <button class="alt adm" id="cfgb" data-i="cfg"></button>
  </div>
  <details class="flt" id="fd" open>
    <summary><span data-i="filters"></span><span class="mu" id="cnt"></span></summary>
    <div class="fgrid">
      <label><span data-i="search"></span><input type="search" id="q" data-ph="phSearch"></label>
      <label><span data-i="sector"></span><select id="secf"></select></label>
      <label><span data-i="clientBiz"></span><select id="cf"></select></label>
      <label><span data-i="project"></span><select id="pf"></select></label>
      <label><span data-i="status"></span><select id="sf"><option value="" data-i="allStatus"></option><option value="due" data-i="due"></option><option value="paid" data-i="paid"></option></select></label>
      <label><span data-i="waFilter"></span><select id="wf"><option value="" data-i="allStatus"></option><option value="business" data-i="waBiz"></option><option value="personal" data-i="waPer"></option><option value="none" data-i="waNone"></option></select></label>
      <label><span data-i="period"></span><select id="per"><option value="all" data-i="pAll"></option><option value="today" data-i="pToday"></option><option value="yest" data-i="pYest"></option><option value="week" data-i="pWeek"></option><option value="lweek" data-i="pLWeek"></option><option value="d7" data-i="p7"></option><option value="d30" data-i="p30"></option><option value="this" data-i="pThis"></option><option value="last" data-i="pLast"></option><option value="ty" data-i="pTy"></option><option value="ly" data-i="pLy"></option><option value="month" data-i="pMonth"></option><option value="year" data-i="pYear"></option><option value="range" data-i="pRange"></option></select></label>
      <label id="wm" class="hid"><span data-i="month"></span><select id="pm"></select></label>
      <label id="wy" class="hid"><span data-i="year"></span><select id="py"></select></label>
      <div id="wr" class="rgw hid"><div class="rg"><span data-i="from"></span><div class="dp" id="r_from" role="group"></div></div><div class="rg"><span data-i="to"></span><div class="dp" id="r_to" role="group"></div></div></div>
      <div class="cl"><button class="alt sm" id="clr" data-i="clear"></button></div>
    </div>
  </details>
  <div class="tw"><table>
    <thead><tr><th data-i="clientBiz"></th><th data-i="project"></th><th data-i="amount"></th><th class="adm" data-i="profit"></th><th data-i="paid"></th><th data-i="status"></th><th data-i="date"></th><th></th></tr></thead>
    <tbody id="tb"></tbody>
  </table></div>
</div>
<button class="fab g" id="fab" aria-label="New Order">+</button>

<dialog id="dlg">
  <h2 id="dt"></h2>
  <div class="fg">
    <label><span data-i="sector"></span><select id="f_sector"></select></label>
    <label id="nsw" class="hid"><span data-i="sectorName"></span><input id="f_nsec"></label>
    <label class="f"><span data-i="biz"></span><input id="f_biz" list="cl" autocomplete="off"></label>
    <datalist id="cl"></datalist><datalist id="yl"></datalist>
    <label class="f"><span data-i="personName"></span><input id="f_name" autocomplete="off"></label>
    <label><span data-i="wa"></span><input id="f_wa" inputmode="tel"></label>
    <label><span data-i="waApp"></span><select id="f_waApp"><option value="" data-i="waNone"></option><option value="business" data-i="waBiz"></option><option value="personal" data-i="waPer"></option></select></label>
    <label><span data-i="projDate"></span><div class="dp" id="f_pdate" role="group"></div></label>
    <label><span data-i="invNo"></span><input id="f_inv"></label>
    <label class="f"><span data-i="fb"></span><input id="f_fb" inputmode="url" placeholder="https://facebook.com/..."></label>
    <label class="f"><span data-i="addrOpt"></span><input id="f_address"></label>
  </div>
  <h3 class="sec" data-i="services"></h3>
  <div id="items"></div>
  <button class="alt sm" id="addIt" data-i="addSvc"></button>
  <div class="fg" style="margin-top:14px">
    <label><span data-i="discount"></span><input id="f_discount" type="number" min="0" inputmode="decimal"></label>
    <label><span data-i="tax"></span><input id="f_tax" type="number" min="0" step="0.5" inputmode="decimal"></label>
  </div>
  <h3 class="sec" data-i="payments"></h3>
  <div id="pays"></div>
  <button class="alt sm" id="addPy" data-i="addPay"></button>
  <div class="adm">
    <h3 class="sec" data-i="costs"></h3>
    <div class="fg">
      <label><span data-i="usdBuy"></span><input id="f_usdBuy" type="number" min="0" step="0.5" inputmode="decimal"></label>
      <label><span data-i="rate"></span><input id="f_rate" type="number" min="0" step="0.5" inputmode="decimal"></label>
      <label><span data-i="expense"></span><input id="f_expense" type="number" min="0" inputmode="decimal"></label>
      <label><span data-i="profitAuto"></span><input id="f_profit" type="number" inputmode="decimal"></label>
    </div>
  </div>
  <div class="sumx" id="sumx"></div>
  <div class="row"><button class="alt" id="cx" data-i="cancel"></button><button class="g" id="sv" data-i="save"></button></div>
</dialog>

<dialog id="payd">
  <h2 data-i="addPayT"></h2>
  <p class="mu" id="pyi"></p>
  <div class="fg">
    <label><span data-i="payDate"></span><div class="dp" id="q_date" role="group"></div></label>
    <label><span data-i="payAmt"></span><input id="q_amt" type="number" min="0" inputmode="decimal"></label>
    <label><span data-i="payMethod"></span><select id="q_met"></select></label>
    <label><span data-i="payNote"></span><input id="q_note"></label>
  </div>
  <div class="row"><button class="alt" id="qc" data-i="cancel"></button><button class="g" id="qs" data-i="save"></button></div>
</dialog>

<dialog id="wad">
  <h2 id="wat"></h2>

/* ---------- cloud, login & roles ---------- */
const te=new TextEncoder();
const hexOf=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
async function hashPw(pw,salt){
  const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
  return hexOf(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(salt),iterations:150000,hash:'SHA-256'},k,256));
}
const norm=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(16));let x='';for(const v of r)x+=a[v%a.length];return x.match(/.{4}/g).join('-')}
async function mkUser(u,pw,r){const salt=hexOf(crypto.getRandomValues(new Uint8Array(16)));return{u:u,salt:salt,hash:await hashPw(pw,salt),role:r}}
async function mkRec(){const code=genCode(),rs=hexOf(crypto.getRandomValues(new Uint8Array(16)));return{code:code,rs:rs,rh:await hashPw(norm(code),rs)}}
const usersOf=d=>!d?[]:Array.isArray(d.users)?d.users:(d.u?[{u:d.u,salt:d.salt,hash:d.hash,role:'admin'}]:[]);
async function saveUsers(users){const d={users:users};if(aref)await aref.set(d);else LS.set('da_auth',d);authDoc=d}
const SS={get(){try{return sessionStorage.getItem('da_ok')}catch(e){return null}},set(v){try{if(v)sessionStorage.setItem('da_ok',v);else sessionStorage.removeItem('da_ok')}catch(e){}}};
let gmode='login';
async function boot(){
  col=sref=aref=null;authDoc={users:[]};
  if(!supabaseClient || SUPABASE_PUBLISHABLE_KEY==='PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE'){
    gmode='blocked';showGate();$('gt').textContent='Supabase setup required';$('gs').textContent='Open this HTML file and replace the Supabase Publishable Key placeholder, then redeploy.';return;
  }
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error)throw error;
    supabaseSession=data.session;
    if(!supabaseSession){gmode='login';showGate();return;}
    const {data:roleRow,error:roleError}=await supabaseClient.from('user_roles').select('role').eq('user_id',supabaseSession.user.id).maybeSingle();
    if(roleError)throw roleError;
    if(!roleRow || !['admin','staff'].includes(roleRow.role)){
      await supabaseClient.auth.signOut();supabaseSession=null;gmode='login';showGate();$('ge').textContent='This account has no assigned role. Ask the administrator.';return;
    }
    const email=supabaseSession.user.email||'';
    curUser={u:email,role:roleRow.role,id:supabaseSession.user.id};role=roleRow.role;
    mode='local';
    startData(curUser);
  }catch(e){gmode='login';showGate();$('ge').textContent='Login setup error: '+(e.message||'Please check Supabase settings and RLS policies.');}
}

/* ---------- date pickers (day / month / free year) ---------- */
const DP={};
function mkDP(id,onch){
  const w=$(id);
  w.innerHTML='<select aria-label="Day"></select><select aria-label="Month"></select><input aria-label="Year" inputmode="numeric" maxlength="4" list="yl" autocomplete="off">';
  const [d,m]=w.querySelectorAll('select'),y=w.querySelector('input');
  y.addEventListener('input',()=>{y.value=y.value.replace(/\D/g,'').slice(0,4)});
  const build=()=>{
    const v=[d.value,m.value];
    d.innerHTML='<option value="">'+t('day')+'</option>'+Array.from({length:31},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join('');
    m.innerHTML='<option value="">'+t('month')+'</option>'+MS[lang].map((x,i)=>'<option value="'+(i+1)+'">'+x+'</option>').join('');
    y.placeholder=t('year');d.value=v[0];m.value=v[1];
  };
  DP[id]={build,
    get(){
      if(!d.value||!m.value||!/^\d{4}$/.test(y.value)||+y.value<1900)return'';
      const last=new Date(+y.value,+m.value,0).getDate();
      if(+d.value>last)d.value=String(last);
      return y.value+'-'+p2(m.value)+'-'+p2(d.value);
    },
    set(iso){
      const a=(iso||'').split('-');
      if(a.length!==3){d.value=m.value=y.value='';return}
      y.value=String(+a[0]);m.value=String(+a[1]);d.value=String(+a[2]);
    }};
  build();
  w.addEventListener('change',()=>{if(onch)onch()});
}

/* ---------- filters ---------- */
const isoD=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const addD=(d,k)=>{const x=new Date(d);x.setDate(x.getDate()+k);return x};
function range(){
  const per=$('per').value,d=new Date(),Y=d.getFullYear(),M=d.getMonth()+1;
  if(per==='today')return[isoD(d),isoD(d)];
  if(per==='yest'){const y=addD(d,-1);return[isoD(y),isoD(y)]}
  if(per==='week'||per==='lweek'){let st=addD(d,-((d.getDay()+1)%7));if(per==='lweek')st=addD(st,-7);return[isoD(st),isoD(addD(st,6))]}
  if(per==='d7')return[isoD(addD(d,-6)),isoD(d)];
  if(per==='d30')return[isoD(addD(d,-29)),isoD(d)];
  if(per==='this')return[Y+'-'+p2(M)+'-01',Y+'-'+p2(M)+'-31'];
  if(per==='last'){const y=M===1?Y-1:Y,m=M===1?12:M-1;return[y+'-'+p2(m)+'-01',y+'-'+p2(m)+'-31']}
  if(per==='ty')return[Y+'-01-01',Y+'-12-31'];
  if(per==='ly')return[(Y-1)+'-01-01',(Y-1)+'-12-31'];
  if(per==='month'&&$('py').value&&$('pm').value)return[$('py').value+'-'+p2($('pm').value)+'-01',$('py').value+'-'+p2($('pm').value)+'-31'];
  if(per==='year'&&$('py').value)return[$('py').value+'-01-01',$('py').value+'-12-31'];
  if(per==='range')return[DP.r_from.get(),DP.r_to.get()];
  return['',''];
}
const inSector=r=>!curSector||(curSector==='__none'?!r.sector:r.sector===curSector);
function getList(){
  const q=$('q').value.trim().toLowerCase(),cf=$('cf').value,pf=$('pf').value,sf=$('sf').value,wf=$('wf').value,rg=range();
  return rows.filter(r=>{
    const due=dueOf(r);
    if(!inSector(r))return false;
    if(cf&&cn(r)!==cf)return false;
    if(pf&&!itemsOf(r).some(i=>i.proj===pf))return false;
    if(sf==='due'&&due<=0)return false;
    if(sf==='paid'&&due>0)return false;
    if(wf==='none'&&r.waApp)return false;
    if(wf&&wf!=='none'&&r.waApp!==wf)return false;
    if(rg[0]&&(!r.pdate||r.pdate<rg[0]))return false;
    if(rg[1]&&(!r.pdate||r.pdate>rg[1]))return false;
    return !q||((r.biz||'')+' '+(r.name||'')+' '+(r.wa||'')+' '+itemsOf(r).map(i=>i.proj+' '+(i.desc||'')).join(' ')).toLowerCase().includes(q);
  }).sort((a,b)=>(b.pdate||'').localeCompare(a.pdate||''));
}
function fillSel(id,first,items){

  el.innerHTML=(first===null?'':'<option value="">'+esc(first)+'</option>')+items.map(x=>'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>').join('');
  if(items.some(x=>String(x[0])===cur))el.value=cur;
}

function pdfFromJpegs(imgs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(i,body)=>{offs[i]=len;push(i+' 0 obj\n'+body+'\nendobj\n')};
  const N=imgs.length;
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+imgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+N+' >>');
  imgs.forEach((im,i)=>{
    const pg=3+3*i,ig=4+3*i,ct=5+3*i;
    obj(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+ig+' 0 R >> >> /Contents '+ct+' 0 R >>');
    offs[ig]=len;
    push(ig+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n');
    push(im.bytes);push('\nendstream\nendobj\n');
    const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(ct,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  });
  const xr=len,cnt=3+3*N;let x='xref\n0 '+cnt+'\n0000000000 65535 f \n';
  for(let i=1;i<cnt;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+cnt+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
window.__pdfFromJpegs=pdfFromJpegs;

      else{const m={};rows.forEach(r=>m[r.id]=r);arr.forEach(o=>m[o.id]=o);rows=Object.values(m);LS.set('da_orders',rows)}
      if(d&&d.cfg&&!Array.isArray(d)){cfg=Object.assign({},DEF,d.cfg);await saveCfg()}
      render();toast(t('bkDone'));
    });
    $('bkf').value='';
  };
  rd.readAsText(f);
};

lang=LS.get('da_lang','en');if(!L[lang])lang='en';invLang=lang;
mkDP('f_pdate');mkDP('q_date');mkDP('r_from',render);mkDP('r_to',render);mkDP('u_from',render);mkDP('u_to',render);
if(window.innerWidth<760)$('fd').open=false;
applyLang();boot();
})();
